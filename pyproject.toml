[project]
name = "pipecraft"
version = "0.0.1"
description = "Collect, analyse, serve and query job postings."
readme = "README.md"
authors = [{ name = "Hckerson", email = "hckerson@gmail.com" }]
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pydantic[email]>=2.14.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--basetemp=.pytest-tmp",
    "--cov=pipecraft",
    "--cov-report=term-missing",
]

[tool.coverage.report]
fail_under = 80
